name: Build thesis PDFs and deploy GitHub Pages

on:
  push:
    branches: ["rewrite"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Build thesis, models, and proofs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/models build/proofs

          # Absolute imports such as "/setup.typ" are rooted at the repository.
          typst compile --root . main.typ build/default.pdf

          # Publish every model/proof that compiles. Drafts must not prevent the
          # site from deploying; main.typ above remains the required build.
          while IFS= read -r -d '' source; do
            output="build/${source%.typ}.pdf"
            mkdir -p "$(dirname "$output")"
            if ! typst compile --root . "$source" "$output"; then
              echo "::warning file=$source::Skipping draft that failed to compile"
              rm -f "$output"
            fi
          done < <(find models proofs -type f -name '*.typ' -print0 | sort -z)

      - name: Prepare the PDF reader site
        shell: bash
        run: |
          set -euo pipefail
          cp public/index.html build/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("build")
          manifest = {
              category: sorted(
                  path.relative_to(root).as_posix()
                  for path in (root / category).rglob("*.pdf")
              )
              for category in ("models", "proofs")
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Determine Release Parameters
        id: vars
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            SHA_SHORT=$(git rev-parse --short HEAD)
            echo "tag_name=build-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "release_name=Draft Build ${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload thesis PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          files: build/default.pdf

      - name: Deploy PDF reader site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/
          keep_files: true
